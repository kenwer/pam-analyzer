[project]
name = "pam-analyzer"
version = "0.10.0"
description = "Automated bird species detection from acoustic recordings."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    # Pinned as birdnet_2_4_onnx and perch_onnx build on lib internals that are not public API (OnnxBackend, the backend protocols, the model cache paths)
    "birdnet>=1.4,<1.5",
    "guano>=1.0.16",
    "h5py>=3.12",
    "mutagen>=1.48",
    "numpy>=1.26",
    "onnx>=1.23",
    "packaging>=24.0",
    "platformdirs>=4.3.0",
    "polars>=1.0",
    "psutil>=6.0.0",
    # Pinned: the toast link reaches a private label attr (_Toast__text_label). Re-verify that hook before bumping. See src/pam_analyzer/ui/toasts.py
    "pyqt-toast-notification==1.3.3",
    "PySide6-Addons>=6.12",
    "PySide6-Essentials>=6.12",
    "scipy>=1.12",
    "soundfile>=0.12.1",
    "tomli-w>=1.2",
    "truststore>=0.10.5",
]

[project.scripts]
pam-analyzer = "pam_analyzer.app.__main__:main"

[dependency-groups]
dev = [
    "poethepoet>=0.29",
    "py-spy>=0.3",
    "pytest>=9.0",
    "pytest-qt>=4.5",
    "ruff>=0.6",
]

# Only scripts/build.py needs these, so they stay out of the default groups a plain `uv sync` installs.
build = [
    "nuitka>=4.3",
]

[tool.uv]
# Ignore system Pythons, so every build bundles the uv-managed Python that .python-version names
python-preference = "only-managed"

# A marker no platform satisfies drops these birdnet deps from the lock and the venv.
# birdnet imports them lazily and this app never reaches those paths: ai-edge-litert
# only backs TFLite models (the app runs ONNX), pandas and pyarrow only back the
# result export methods (the app reads results through to_structured_array).
override-dependencies = [
    "ai-edge-litert; sys_platform == 'never'",
    "pandas; sys_platform == 'never'",
    "pyarrow; sys_platform == 'never'",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
# Exclude files generated from .ui and .qrc sources
extend-exclude = [
    "**/ui_*.py",
    "**/*_rc.py",
]

[tool.ruff.lint]
# Never enforce `E501` (line length violations).
ignore = ["E501"]
# Select specific error codes to enforce
select = [
    "F",    # Pyflakes (basic Python errors)
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # Import sorting
    "C4",   # Flake8 Comprehensions
    "B",    # Flake8 Bugbear (security and design checks)
    "UP",   # Pyupgrade (modernize Python code)
]

[tool.poe.tasks]
compile-ui = { cmd = "python scripts/compile_ui.py", help = "Compile Qt Designer .ui files to ui_*.py modules" }
compile-qrc = { cmd = "python scripts/compile_qrc.py", help = "Compile Qt resource files to *_rc.py modules" }
compile-qt = { sequence = ["compile-ui", "compile-qrc"], help = "Compile Qt UI and resource files" }
designer = { shell = "open -a $VIRTUAL_ENV/lib/python*/site-packages/PySide6/Designer.app \"$ui\"", interpreter = "bash", args = [{ name = "ui", positional = true, help = "Path to the .ui file" }], help = "Open Qt Designer.app on a given .ui file (macOS only)" }
run-app = { cmd = "python -m pam_analyzer", help = "Run the app without recompiling UI/resources" }
run = { ref = "run-app", deps = ["compile-qt"], help = "Compile UI/resources, then run the app" }
run-dbg = { cmd = "python -m pam_analyzer", env = {PAM_LOG_LEVEL = "DEBUG"}, deps = ["compile-qt"], help = "Compile UI/resources, then run the app with DEBUG logging" }
profile = { cmd = "py-spy record -o spectrogram_profile.svg -- python -m pam_analyzer", help = "Record a py-spy flame graph; navigate the app then Ctrl+C to write spectrogram_profile.svg (Windows: run as Administrator)" }
# cmd tasks forward extra arguments, so `poe test -k name` reaches pytest
test = { cmd = "pytest", deps = ["compile-qt"], help = "Compile UI/resources, then run all tests" }
test-fast = { cmd = "pytest -m 'not slow'", deps = ["compile-qt"], help = "Compile UI/resources, then run only fast tests" }
test-slow = { cmd = "pytest -m slow", deps = ["compile-qt"], help = "Compile UI/resources, then run only the slow model tests" }
lint = { cmd = "ruff check src tests", help = "Run the ruff linter" }
fmt = { cmd = "ruff format src tests", help = "Run the ruff formatter" }
install-hooks = { cmd = "git config core.hooksPath .githooks", help = "Point git at the repo's tracked hooks (pre-push runs test-fast)" }
build = { cmd = "uv run --script scripts/build.py", help = "Compile a standalone distributable for the current platform" }
prewarm = { cmd = "python scripts/prewarm_models.py", help = "Download every engine's model files (into BIRDNET_APP_DATA, else the per-user folder) so the slow tests never download" }

# uv ships the list of downloadable Pythons inside its own release, so upgrade uv first to see new patches
[tool.poe.tasks.upgrade-python]
help = "Pin the newest patch release of the pinned Python minor version and sync"
# Hides the "Poe =>" echo of the whole script, the task's own output still shows
verbosity = -1
args = [{ name = "dry-run", type = "boolean", help = "Only report whether a newer patch release exists" }]
shell = """
set -e
PINNED=$(cat .python-version)
LATEST=$(uv python list "${PINNED%.*}" --only-downloads | head -n 1 | cut -d- -f2)
if [ -z "$LATEST" ]; then
    echo "uv lists no downloads for Python ${PINNED%.*}"
    exit 1
elif [ "$PINNED" = "$LATEST" ]; then
    echo "Python $PINNED is the newest ${PINNED%.*} release known to uv $(uv --version | cut -d' ' -f2)"
elif [ -n "$dry_run" ]; then
    echo "Python $LATEST is available (pinned: $PINNED)"
else
    uv python pin "$LATEST"
    uv sync
fi
"""

[tool.poe.tasks.upgrade-deps]
help = "Upgrade all locked dependencies and sync"
verbosity = -1
args = [{ name = "dry-run", type = "boolean", help = "Only report which locked versions would change" }]
shell = """
set -e
if [ -n "$dry_run" ]; then
    uv lock --upgrade --dry-run
else
    uv lock --upgrade
    uv sync
fi
"""

[tool.pytest]
testpaths = ["tests"]
addopts = [
    "-ra",
    "-q",
    # pytest-qt swaps a Python Qt message handler in and out per test. PySide6
    # segfaults when a non-Python thread (FFmpeg's loader) logs through that
    # handler while it is removed. Qt messages go to stderr instead.
    "--no-qt-log",
    # List only tests over a second, so a healthy run prints nothing extra
    "--durations=15",
    "--durations-min=1.0",
]
# Dump all-thread tracebacks to stderr when a single test exceeds this many
# seconds, so a hang identifies itself in CI logs (it does not kill the test).
faulthandler_timeout = 120
qt_api = "pyside6"
markers = [
    "slow: opt-in tests that load heavy ML models or download artifacts (run with: pytest -m slow)",
]
