name: Build Distributable

on:
  workflow_dispatch:
    inputs:
      upload_release_assets:
        description: 'Release tag to upload assets to (e.g. v0.1.1)'
        required: false
        default: ''
  release:
    types: [published]
  pull_request:
    branches: [ "master" ]
    paths:
      - 'scripts/build.py'
      - 'scripts/convert_birdnet_2_4_onnx.py'
      - 'scripts/fetch_perch_onnx.py'
      - 'scripts/smoke_test_installer.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/build.yml'
      - '.github/workflows/prewarm-models.yml'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  models:
    uses: ./.github/workflows/prewarm-models.yml

  build:
    name: Build (${{ matrix.name }})
    needs: models
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (arm64)
            asset: PAM-Analyzer-macos-arm64.dmg
          # macOS Intel (x86_64) is disabled because TensorFlow dropped macOS x86_64
          # wheels starting with 2.21.0, and Perch 2.0 doesn't support Intel mac either
          # - os: macos-15-intel
          #   name: macOS (x86_64)
          #   asset: PAM-Analyzer-macos-x86_64.dmg
          - os: windows-latest
            name: Windows
            asset: PAM-Analyzer-windows-x86_64-setup.exe
          # Pinned, not ubuntu-latest: the AppImage needs a glibc at least as new as the build's
          - os: ubuntu-24.04
            name: Linux (x86_64)
            asset: PAM-Analyzer-linux-x86_64.AppImage
          - os: ubuntu-24.04-arm
            name: Linux (arm64)
            asset: PAM-Analyzer-linux-arm64.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Rebuilding an old release checks out its tag, since the tag sets
          # the app version. Empty on every other event, which keeps the default.
          ref: ${{ inputs.upload_release_assets }}
          # The app version comes from the git tags, which a shallow clone lacks
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          models-cache-key: ${{ needs.models.outputs.cache-key }}

      - name: Run tests
        # On pull_request the Test workflow already ran them on this commit.
        if: github.event_name != 'pull_request'
        timeout-minutes: 15
        uses: ./.github/actions/run-tests

      - name: Build distributable
        uses: ./.github/actions/build-dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  smoke:
    name: Smoke test (${{ matrix.name }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write  # softprops/action-gh-release publishes from this job
    strategy:
      fail-fast: false
      matrix:
        # Same platforms and asset names as the build matrix
        include:
          - os: macos-latest
            name: macOS (arm64)
            asset: PAM-Analyzer-macos-arm64.dmg
          - os: windows-latest
            name: Windows
            asset: PAM-Analyzer-windows-x86_64-setup.exe
          - os: ubuntu-24.04
            name: Linux (x86_64)
            asset: PAM-Analyzer-linux-x86_64.AppImage
          - os: ubuntu-24.04-arm
            name: Linux (arm64)
            asset: PAM-Analyzer-linux-arm64.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.upload_release_assets }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install system dependencies
        # What a desktop Linux has and a bare runner lacks: Qt's system libs,
        # plus fuse3, which the AppImage runtime mounts itself with
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y fuse3 libegl1 libpulse0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-util1 libxcb-render-util0 libxcb-image0 libxcb-shape0 libxcb-xkb1 libxcb-icccm4 libxcb-keysyms1 libtiff6 libminizip1t64 libgstreamer-plugins-base1.0-0 libgstreamer-plugins-good1.0-0 libgstreamer-plugins-bad1.0-0 libgstreamer-gl1.0-0

      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.name }}
          path: dist

      - name: Install and start the app
        shell: bash
        run: uv run --script scripts/smoke_test_installer.py "dist/${{ matrix.asset }}"

      - name: Upload release asset
        # Only an installer that passed the smoke test reaches the release
        if: github.event_name == 'release' || inputs.upload_release_assets != ''
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          # Empty on a release event, where the action takes the tag from github.ref
          tag_name: ${{ inputs.upload_release_assets }}
          # The name build.py gives the installer. A mismatch fails the upload.
          files: dist/${{ matrix.asset }}
          fail_on_unmatched_files: true
