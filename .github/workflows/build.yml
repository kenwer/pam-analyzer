name: Build Distributable

on:
  workflow_dispatch:
    inputs:
      upload_release_assets:
        description: 'Release tag to upload assets to (e.g. v0.1.1)'
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (arm64)
            os_name: macos
            arch: arm64
            archive_ext: zip
          # macOS Intel (x86_64) is disabled because TensorFlow dropped macOS x86_64
          # wheels starting with 2.21.0, and Perch 2.0 doesn't support Intel mac either
          # - os: macos-15-intel
          #   name: macOS (x86_64)
          #   os_name: macos
          #   arch: x86_64
          #   archive_ext: zip
          - os: windows-latest
            name: Windows
            os_name: windows
            arch: x86_64
            archive_ext: zip
          - os: ubuntu-latest
            name: Linux (x86_64)
            os_name: linux
            arch: x86_64
            archive_ext: tar.gz
          - os: ubuntu-24.04-arm
            name: Linux (arm64)
            os_name: linux
            arch: arm64
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set VERSION and ARCHIVE_NAME
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          elif [[ -n "${{ inputs.upload_release_assets }}" ]]; then
            echo "VERSION=${{ inputs.upload_release_assets }}" >> $GITHUB_ENV
          else
            echo "VERSION=dev" >> $GITHUB_ENV
          fi
          echo "ARCHIVE_NAME=PAM-Analyzer-${{ matrix.os_name }}-${{ matrix.arch }}.${{ matrix.archive_ext }}" >> $GITHUB_ENV

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Run tests
        timeout-minutes: 15
        uses: ./.github/actions/run-tests

      - name: Build distributable
        uses: ./.github/actions/build-dist
        with:
          os_name: ${{ matrix.os_name }}
          arch: ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release' || inputs.upload_release_assets != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/${{ env.ARCHIVE_NAME }}
          fail_on_unmatched_files: true
