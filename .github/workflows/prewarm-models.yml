name: Prewarm models

# Downloads the models once, on one runner, through the app's model store, and
# saves them to the cache that every platform's test job then restores for the
# slow tests. Without it each matrix job on a cold cache fetches about 1 GB.

on:
  workflow_call:
    outputs:
      cache-key:
        description: Key of the models cache entry, to pass to the setup-env action.
        value: ${{ jobs.models.outputs.cache-key }}

permissions:
  contents: read

jobs:
  models:
    name: Prewarm models
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    # Two pushes in quick succession would both prewarm on a cold key, and
    # the one that loses the save would hand its jobs a key that is still
    # uploading. Queued, the second run finds the entry instead.
    concurrency: prewarm-models-${{ github.ref }}
    outputs:
      cache-key: ${{ steps.models-cache.outputs.cache-primary-key }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Keyed on the locked birdnet version rather than the whole of uv.lock,
      # which changes with every dependency upgrade, even ones that leave the
      # models alone.
      - name: Read locked birdnet version
        id: birdnet
        run: |
          version=$(awk '/^name = "birdnet"$/ { found = 1; next } found && /^version = / { gsub(/"/, "", $3); print $3; exit }' uv.lock)
          if [ -z "$version" ]; then
            echo "::error::birdnet not found in uv.lock"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Look up BirdNET models
        id: models-cache
        uses: actions/cache/restore@v6
        with:
          path: dist/.birdnet-models
          # The models are platform-independent data, so one archive serves
          # every runner OS.
          enableCrossOsArchive: true
          # Only checks that the entry exists. Nothing here reads the models
          # on a hit, so downloading the 940 MB archive is left to the jobs
          # that do.
          lookup-only: true
          # Everything that decides which files land in the cache: the birdnet
          # version, the store, and the modules that pin each engine's artifacts.
          key: birdnet-models-${{ steps.birdnet.outputs.version }}-${{ hashFiles('scripts/prewarm_models.py', 'src/pam_analyzer/infrastructure/model_store.py', 'src/pam_analyzer/infrastructure/birdnet_lib.py', 'src/pam_analyzer/infrastructure/perch_onnx.py', 'src/pam_analyzer/infrastructure/birdnet_2_4_onnx.py', 'src/pam_analyzer/infrastructure/birdnet_2_4_convert.py', 'src/pam_analyzer/infrastructure/birdnet_2_4_keras_onnx.py', 'src/pam_analyzer/infrastructure/*_runner.py') }}

      - name: Install uv
        if: steps.models-cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v9.0.0

      - name: Prewarm models
        if: steps.models-cache.outputs.cache-hit != 'true'
        env:
          # The same folder the run-tests action points the tests at
          BIRDNET_APP_DATA: ${{ github.workspace }}/dist/.birdnet-models/birdnet-app-data
        run: uv run poe prewarm

      - name: Save BirdNET models
        if: steps.models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          # path and enableCrossOsArchive have to match the lookup above and
          # the restore in the setup-env action, or the entry is not found.
          path: dist/.birdnet-models
          enableCrossOsArchive: true
          key: ${{ steps.models-cache.outputs.cache-primary-key }}
