name: Diagnose Windows heap crash

# Temporary. Hunts the exit 139 that the fast suite hits on Windows with the
# uv-managed interpreter. Lives on this branch only and must not reach master.
on:
  push:
    branches: [ "diag/windows-heap" ]

permissions:
  contents: read

env:
  CRASHING_FILE: tests/ui/test_campaign_detail_widget_folder_import.py

jobs:
  diagnose:
    name: Diagnose (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Not setup-env: the crashing file needs no models, and the prewarm
      # costs ten minutes per round.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Sync and compile UI
        shell: bash
        run: |
          uv sync
          uv run python -c "import sys; print(sys.version); print(sys._base_executable)"
          uv run poe compile-ui
          uv run poe compile-qrc

      # Round 5: the crash comes when the first test's panel is destroyed, on a
      # native thread. Every panel holds a live OSM map that fetches tiles over
      # HTTPS, so these variants take the map, the network and the TLS backend
      # out one at a time. See tests/ui/test_diag_mut.py.
      - name: Variant base, copy of the crashing shape
        id: base
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          DIAG: base
        run: |
          status=0
          for i in 1 2 3; do
            uv run pytest tests/ui/test_diag_mut.py && echo "RUN $i: passed" || { status=$?; echo "RUN $i: exit $status"; }
          done
          exit $status

      - name: Variant nomap, map QML never loaded
        id: nomap
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          DIAG: nomap
        run: |
          status=0
          for i in 1 2 3; do
            uv run pytest tests/ui/test_diag_mut.py && echo "RUN $i: passed" || { status=$?; echo "RUN $i: exit $status"; }
          done
          exit $status

      - name: Variant deadproxy, map loaded, network dead
        id: deadproxy
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          DIAG: deadproxy
        run: |
          status=0
          for i in 1 2 3; do
            uv run pytest tests/ui/test_diag_mut.py && echo "RUN $i: passed" || { status=$?; echo "RUN $i: exit $status"; }
          done
          exit $status

      - name: Variant schannel, map loaded, TLS pinned to schannel
        id: schannel
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          DIAG: schannel
        run: |
          status=0
          for i in 1 2 3; do
            uv run pytest tests/ui/test_diag_mut.py && echo "RUN $i: passed" || { status=$?; echo "RUN $i: exit $status"; }
          done
          exit $status

      # The same file passes as `python -m pytest` and crashes as `pytest`.
      # Dump the loaded modules and Qt's TLS details under both launchers, taken
      # just before the point where the crash would come.
      - name: Module and TLS info, launched as pytest
        id: info_exe
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          DIAG_INFO: exe
        run: uv run pytest tests/ui/test_diag_mut.py

      - name: Module and TLS info, launched as python -m pytest
        id: info_mod
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          DIAG_INFO: mod
        run: uv run python -m pytest tests/ui/test_diag_mut.py

      - name: Compare the two launchers
        if: always()
        shell: bash
        run: |
          for f in diag-info-exe.txt diag-info-mod.txt; do
            echo "==== $f"
            if [ -f "$f" ]; then
              grep -c '^module' "$f"
              grep '^tls' "$f"
              echo "-- modules outside the Windows directory:"
              grep '^module' "$f" | grep -v -i -F 'C:\Windows\' || true
            else
              echo "missing"
            fi
          done
          echo "==== diff exe vs mod"
          diff diag-info-exe.txt diag-info-mod.txt || true

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "variant base:                         ${{ steps.base.outcome }}"
          Write-Host "variant nomap:                        ${{ steps.nomap.outcome }}"
          Write-Host "variant deadproxy:                    ${{ steps.deadproxy.outcome }}"
          Write-Host "variant schannel:                     ${{ steps.schannel.outcome }}"
          Write-Host "info, launched as pytest:             ${{ steps.info_exe.outcome }}"
          Write-Host "info, launched as python -m pytest:   ${{ steps.info_mod.outcome }}"
