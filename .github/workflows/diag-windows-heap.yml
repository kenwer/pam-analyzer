name: Diagnose Windows heap crash

# Temporary. Hunts the exit 139 that the fast suite hits on Windows with the
# uv-managed interpreter. Lives on this branch only and must not reach master.
on:
  push:
    branches: [ "diag/windows-heap" ]

permissions:
  contents: read

env:
  CRASHING_FILE: tests/ui/test_campaign_detail_widget_folder_import.py
  # Lets pytest import the gcdiag plugin.
  PYTHONPATH: ${{ github.workspace }}\.github\diag

jobs:
  diagnose:
    name: Diagnose (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Not setup-env: the crashing file needs no models, and the prewarm
      # costs ten minutes per round.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Sync and compile UI
        shell: bash
        run: |
          uv sync
          uv run python -c "import sys; print(sys.version); print(sys._base_executable)"
          uv run poe compile-ui
          uv run poe compile-qrc

      # The crash is sensitive to how pytest is started: `python -m pytest`
      # under procdump passed 3 of 3. So every variant below keeps the failing
      # command line and runs 3 times, and noop tells whether merely loading
      # the plugin already hides the crash.
      - name: Control, no plugin
        id: control
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          status=0
          for i in 1 2 3; do
            uv run pytest "$CRASHING_FILE" && echo "RUN $i: passed" || { status=$?; echo "RUN $i: exit $status"; }
          done
          exit $status

      - name: Plugin loaded, noop
        id: noop
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          GCDIAG: noop
        run: |
          status=0
          for i in 1 2 3; do
            uv run pytest -p gcdiag "$CRASHING_FILE" && echo "RUN $i: passed" || { status=$?; echo "RUN $i: exit $status"; }
          done
          exit $status

      - name: Log collections that run off the main thread
        id: log
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          GCDIAG: log
        run: |
          status=0
          for i in 1 2 3; do
            uv run pytest -p gcdiag "$CRASHING_FILE" && echo "RUN $i: passed" || { status=$?; echo "RUN $i: exit $status"; }
          done
          exit $status

      - name: Automatic collection disabled
        id: disable
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          GCDIAG: disable
        run: |
          status=0
          for i in 1 2 3; do
            uv run pytest -p gcdiag "$CRASHING_FILE" && echo "RUN $i: passed" || { status=$?; echo "RUN $i: exit $status"; }
          done
          exit $status

      - name: Collect on the main thread before each test
        id: collect
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          GCDIAG: collect
        run: |
          status=0
          for i in 1 2 3; do
            uv run pytest -p gcdiag "$CRASHING_FILE" && echo "RUN $i: passed" || { status=$?; echo "RUN $i: exit $status"; }
          done
          exit $status

      # The same two decisive variants against the whole fast suite would need
      # the models, so tests/ui stands in for it.
      - name: tests/ui with automatic collection disabled
        id: ui_disable
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          GCDIAG: disable
        run: uv run pytest -p gcdiag -m 'not slow' tests/ui

      - name: tests/ui with a main thread collect before each test
        id: ui_collect
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          GCDIAG: collect
        run: uv run pytest -p gcdiag -m 'not slow' tests/ui

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "control, no plugin:               ${{ steps.control.outcome }}"
          Write-Host "plugin loaded, noop:              ${{ steps.noop.outcome }}"
          Write-Host "log off-main collections:         ${{ steps.log.outcome }}"
          Write-Host "automatic collection disabled:    ${{ steps.disable.outcome }}"
          Write-Host "main thread collect per test:     ${{ steps.collect.outcome }}"
          Write-Host "tests/ui, collection disabled:    ${{ steps.ui_disable.outcome }}"
          Write-Host "tests/ui, collect per test:       ${{ steps.ui_collect.outcome }}"
