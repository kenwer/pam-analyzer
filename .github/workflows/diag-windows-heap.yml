name: Diagnose Windows heap crash

# Temporary. Hunts the exit 139 that the fast suite hits on Windows with the
# uv-managed interpreter. Lives on this branch only and must not reach master.
on:
  push:
    branches: [ "diag/windows-heap" ]

permissions:
  contents: read

env:
  CRASHING_FILE: tests/ui/test_campaign_detail_widget_folder_import.py

jobs:
  diagnose:
    name: Diagnose (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Not setup-env: the crashing file needs no models, and the prewarm
      # costs ten minutes per round.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Sync and compile UI
        shell: bash
        run: |
          uv sync
          uv run python -c "import sys; print(sys.version); print(sys._base_executable)"
          uv run poe compile-ui
          uv run poe compile-qrc

      # Round 6 found the cause: Qt's OpenSSL backend picks up Git for Windows'
      # libssl from PATH while Python's own copy is loaded too, and the map's
      # tile fetch then corrupts the heap. map_picker.py now pins schannel.
      # These steps check that the pin holds on the real tests.
      - name: Show the TLS backend after importing the map picker
        shell: bash
        run: |
          uv run python -c "
          import pam_analyzer.widgets.map_picker
          from PySide6.QtNetwork import QSslSocket
          print('active backend:', QSslSocket.activeBackend())
          "

      - name: Crashing file, 5 runs
        id: real
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          status=0
          for i in 1 2 3 4 5; do
            uv run pytest "$CRASHING_FILE" && echo "RUN $i: passed" || { status=$?; echo "RUN $i: exit $status"; }
          done
          exit $status

      - name: Copy of the crashing shape, 3 runs
        id: base
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          status=0
          for i in 1 2 3; do
            uv run pytest tests/ui/test_diag_mut.py && echo "RUN $i: passed" || { status=$?; echo "RUN $i: exit $status"; }
          done
          exit $status

      - name: All of tests/ui and tests/widgets, 2 runs
        id: ui
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          status=0
          for i in 1 2; do
            uv run pytest -m 'not slow' tests/ui tests/widgets && echo "RUN $i: passed" || { status=$?; echo "RUN $i: exit $status"; }
          done
          exit $status

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "crashing file, 5 runs:          ${{ steps.real.outcome }}"
          Write-Host "copy of the crashing shape:     ${{ steps.base.outcome }}"
          Write-Host "tests/ui and tests/widgets:     ${{ steps.ui.outcome }}"
