name: Diagnose Windows heap crash

# Temporary. Hunts the exit 139 that the fast suite hits on Windows with the
# uv-managed interpreter. Lives on this branch only and must not reach master.
on:
  push:
    branches: [ "diag/windows-heap" ]

permissions:
  contents: read

env:
  DUMP_DIR: ${{ github.workspace }}\crashdumps
  CRASHING_FILE: tests/ui/test_campaign_detail_widget_folder_import.py

jobs:
  diagnose:
    name: Diagnose (Windows)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Not setup-env: the crashing file needs no models, and the prewarm
      # costs ten minutes per round.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Sync and compile UI
        shell: bash
        run: |
          uv sync
          uv run python -c "import sys; print(sys.version); print(sys.executable); print(sys._base_executable)"
          uv run poe compile-ui
          uv run poe compile-qrc

      # Is a QThread alone enough, or a thread pool inside a QThread, with no
      # pytest, widgets or project code involved?
      - name: Phase A1, standalone QThread without a pool
        id: a1
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: uv run python .github/diag/qthread_pool_repro.py nopool

      - name: Phase A2, standalone QThread with a thread pool
        id: a2
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: uv run python .github/diag/qthread_pool_repro.py pool

      - name: Phase A3, crashing file, unchanged
        id: a3
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: uv run pytest "$CRASHING_FILE"

      - name: Fetch procdump
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\procdump.zip"
          Invoke-WebRequest -Uri https://download.sysinternals.com/files/Procdump.zip -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\procdump" -Force
          New-Item -ItemType Directory -Force -Path $env:DUMP_DIR | Out-Null
          # procdump has to launch the real interpreter, not the venv launcher
          # that would start it as a child. __PYVENV_LAUNCHER__ is how that
          # launcher tells the interpreter which venv it belongs to.
          $base = uv run python -c "import sys; print(sys._base_executable)"
          $launcher = (Resolve-Path .venv\Scripts\python.exe).Path
          "PROCDUMP=$env:RUNNER_TEMP\procdump\procdump64.exe" >> $env:GITHUB_ENV
          "BASE_PYTHON=$base" >> $env:GITHUB_ENV
          "__PYVENV_LAUNCHER__=$launcher" >> $env:GITHUB_ENV

      - name: Check the direct launch lands in the venv
        shell: pwsh
        run: |
          & $env:BASE_PYTHON -c "import sys, pytest; print(sys.prefix); print(pytest.__file__)"

      # _NO_DEBUG_HEAP keeps the normal heap. Without it a process started
      # under a debugger gets the debug heap, which would change the layout.
      - name: Phase B, crashing file under procdump
        id: b
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        env:
          _NO_DEBUG_HEAP: "1"
        run: |
          & $env:PROCDUMP -accepteula -ma -e -x "$env:DUMP_DIR\normal" $env:BASE_PYTHON -m pytest $env:CRASHING_FILE
          Get-ChildItem "$env:DUMP_DIR\normal" -ErrorAction SilentlyContinue

      # Full page heap puts every heap block against a guard page, so the write
      # that damages the heap faults on the spot, in the thread that made it.
      # 0x02000000 is FLG_HEAP_PAGE_ALLOCS and PageHeapFlags 0x3 is full page
      # heap with allocation stack traces.
      - name: Enable full page heap for python.exe
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\python.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name GlobalFlag -Value 0x02000000 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name PageHeapFlags -Value 0x3 -PropertyType DWord -Force | Out-Null

      - name: Phase C, crashing file under procdump with page heap
        id: c
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: |
          & $env:PROCDUMP -accepteula -ma -e -x "$env:DUMP_DIR\pageheap" $env:BASE_PYTHON -m pytest $env:CRASHING_FILE
          Get-ChildItem "$env:DUMP_DIR\pageheap" -ErrorAction SilentlyContinue

      # PYTHONMALLOC=malloc routes Python's own small objects through the
      # system heap too, so page heap also guards those.
      - name: Phase D, same with PYTHONMALLOC=malloc
        id: d
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        env:
          PYTHONMALLOC: malloc
        run: |
          & $env:PROCDUMP -accepteula -ma -e -x "$env:DUMP_DIR\pageheap-malloc" $env:BASE_PYTHON -m pytest $env:CRASHING_FILE
          Get-ChildItem "$env:DUMP_DIR\pageheap-malloc" -ErrorAction SilentlyContinue

      - name: Disable page heap
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\python.exe' -Recurse -Force -ErrorAction SilentlyContinue

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "A1 standalone QThread, no pool:   ${{ steps.a1.outcome }}"
          Write-Host "A2 standalone QThread with pool:  ${{ steps.a2.outcome }}"
          Write-Host "A3 crashing file, unchanged:      ${{ steps.a3.outcome }}"
          Write-Host "B, C, D always report success, look at the dumps:"
          Get-ChildItem $env:DUMP_DIR -Recurse -Filter *.dmp -ErrorAction SilentlyContinue |
            Format-Table FullName, Length, LastWriteTimeUtc -AutoSize

      - name: Summarize dumps
        if: always()
        timeout-minutes: 10
        shell: pwsh
        run: |
          $dumps = Get-ChildItem $env:DUMP_DIR -Recurse -Filter *.dmp -ErrorAction SilentlyContinue | Sort-Object LastWriteTimeUtc
          if (-not $dumps) {
            Write-Host "::warning::no dumps were written"
            exit 0
          }
          # -I and an absolute script path: the dumps are data from a crashed
          # process, so the interpreter must not import anything from beside them.
          & $env:BASE_PYTHON -I "$env:GITHUB_WORKSPACE\.github\diag\dump_summary.py" @($dumps.FullName)

      - name: Upload dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-crashdumps
          path: crashdumps/
          if-no-files-found: warn
          retention-days: 3
