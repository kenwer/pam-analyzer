name: Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (arm64)
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux (x86_64)
          - os: ubuntu-24.04-arm
            name: Linux (arm64)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Run tests
        timeout-minutes: 15
        uses: ./.github/actions/run-tests
