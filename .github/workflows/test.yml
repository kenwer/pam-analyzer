name: Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_call:

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (arm64)
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux (x86_64)
          - os: ubuntu-24.04-arm
            name: Linux (arm64)

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install system dependencies
        # On Linux Qt requires libEGL.so.1, libpulse.so.0, the X11, and gstreamer libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libegl1 libpulse0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-util1 libxcb-render-util0 libxcb-image0 libxcb-shape0 libxcb-xkb1 libxcb-icccm4 libxcb-keysyms1 libtiff6 libminizip1t64 libgstreamer-plugins-base1.0-0 libgstreamer-plugins-good1.0-0 libgstreamer-plugins-bad1.0-0 libgstreamer-gl1.0-0

      - name: Cache BirdNET models
        uses: actions/cache@v5
        with:
          path: dist/.birdnet-models
          key: birdnet-models-${{ hashFiles('uv.lock', 'src/pam_analyzer/infrastructure/model_versions.py') }}

      - name: Prewarm models
        # Populates the cache (with retry-on-failure) before tests run, so a cold
        # cache never triggers a bare, un-retried download from inside pytest.
        run: uv run --script scripts/build.py --prewarm-only

      # Fast and slow tests run as separate pytest processes so the Qt/UI
      # tests never share an address space with leftover state from the model
      # tests (the birdnet session can leak worker processes and feeder
      # threads, https://github.com/birdnet-team/birdnet/issues/51).
      # Each step normally finishes in about a minute per platform; the
      # timeout makes a hung test fail the job quickly instead of occupying
      # a runner for the 6 hour default limit.
      - name: Run fast tests
        timeout-minutes: 15
        env:
          BIRDNET_APP_DATA: ${{ github.workspace }}/dist/.birdnet-models/birdnet-app-data
          KAGGLEHUB_CACHE: ${{ github.workspace }}/dist/.birdnet-models/kagglehub
        run: uv run poe test-fast

      - name: Run slow tests
        timeout-minutes: 15
        env:
          BIRDNET_APP_DATA: ${{ github.workspace }}/dist/.birdnet-models/birdnet-app-data
          KAGGLEHUB_CACHE: ${{ github.workspace }}/dist/.birdnet-models/kagglehub
        run: uv run poe test-slow
