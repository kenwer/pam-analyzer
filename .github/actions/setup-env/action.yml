name: Setup environment
description: Install uv, system dependencies, the project environment, and restore the BirdNET models cache. Assumes the repo is already checked out.

inputs:
  models-cache-key:
    description: Key of the models cache entry, the cache-key output of the prewarm-models workflow.
    required: true

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0

    - name: Install system dependencies
      # On Linux Qt requires libEGL.so.1, libpulse.so.0, the X11, and gstreamer libs
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y libegl1 libpulse0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-util1 libxcb-render-util0 libxcb-image0 libxcb-shape0 libxcb-xkb1 libxcb-icccm4 libxcb-keysyms1 libtiff6 libminizip1t64 libgstreamer-plugins-base1.0-0 libgstreamer-plugins-good1.0-0 libgstreamer-plugins-bad1.0-0 libgstreamer-gl1.0-0

    - name: Restore BirdNET models
      uses: actions/cache/restore@v6
      with:
        path: dist/.birdnet-models
        enableCrossOsArchive: true
        key: ${{ inputs.models-cache-key }}
        # The prewarm-models workflow found or saved this entry before this
        # job started. A miss means that hand-off broke, and falling through
        # would leave pytest or the build to download the models un-retried.
        fail-on-cache-miss: true

    # Synced here so a cold uv cache does not eat into the callers' timeout on
    # the test step.
    - name: Sync project environment
      shell: bash
      run: uv sync
