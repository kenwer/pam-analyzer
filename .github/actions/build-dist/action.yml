name: Build distributable
description: Build the app and package it into a release archive. Expects VERSION and ARCHIVE_NAME to already be set in the environment.

inputs:
  os_name:
    description: matrix os_name (macos, windows, linux)
    required: true
  arch:
    description: matrix arch (arm64, x86_64)
    required: true

runs:
  using: composite
  steps:
    - name: Build distributable
      shell: bash
      run: uv run --script scripts/build.py

    - name: Package archive
      shell: bash
      run: |
        cd dist
        versioned="pam-analyzer-${VERSION}-${{ inputs.os_name }}-${{ inputs.arch }}"
        case "${{ inputs.os_name }}" in
          macos)
            mv pam-analyzer.app "${versioned}.app"
            # -y stores symlinks as symlinks. Nuitka moves the dot-named
            # model dirs (v2.4, v3.0) to Contents/Resources and symlinks them
            # back.
            zip -r -9 -y "$ARCHIVE_NAME" "${versioned}.app"
            rm -rf "${versioned}.app"
            ;;
          windows)
            mv pam-analyzer.exe "${versioned}.exe"
            7z a -mx=9 "$ARCHIVE_NAME" "${versioned}.exe"
            ;;
          linux)
            mv pam-analyzer "$versioned"
            tar -czf "$ARCHIVE_NAME" "$versioned"
            ;;
        esac
