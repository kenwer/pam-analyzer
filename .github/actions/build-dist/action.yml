name: Build distributable
description: Build the app and package it into a release archive. Expects VERSION and ARCHIVE_NAME to already be set in the environment.

inputs:
  os_name:
    description: matrix os_name (macos, windows, linux)
    required: true
  arch:
    description: matrix arch (arm64, x86_64)
    required: true

runs:
  using: composite
  steps:
    - name: Build distributable
      shell: bash
      run: uv run --script scripts/build.py

    - name: Package archive
      shell: bash
      run: |
        cd dist
        versioned="pam-analyzer-${VERSION}-${{ inputs.os_name }}-${{ inputs.arch }}"
        case "${{ inputs.os_name }}" in
          macos)
            mv pam-analyzer.app "${versioned}.app"
            # Strip the sidecars and re-sign before archiving
            find "${versioned}.app" -name '._*' -delete
            xattr -cr "${versioned}.app"
            codesign --force --sign - "${versioned}.app"
            codesign --verify --deep --strict "${versioned}.app"
            # -y stores the bundle's ~2000 internal symlinks as symlinks.
            # Without it zip dereferences them, duplicating gigabytes of
            # Frameworks/Resources content and blowing past the 2 GiB
            # GitHub release asset limit.
            zip -r -9 -y "$ARCHIVE_NAME" "${versioned}.app"
            rm -rf "${versioned}.app"
            ;;
          windows)
            mv pam-analyzer.exe "${versioned}.exe"
            7z a -mx=9 "$ARCHIVE_NAME" "${versioned}.exe"
            ;;
          linux)
            mv pam-analyzer "$versioned"
            tar -czf "$ARCHIVE_NAME" "$versioned"
            ;;
        esac
